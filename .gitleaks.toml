# Secret scanning configuration (gitleaks). The default rule set applies; the allowlists
# below cover public identifiers that the generic-api-key rule mistakes for secrets.
# Keep each one narrow: a value only matches if it cannot be a credential.

[extend]
useDefault = true

[[allowlists]]
description = "EVM contract addresses (0x + 40 hex) in strategy manifests are public, on-chain identifiers. A private key is 64 hex, so it never matches."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"?[A-Za-z_][A-Za-z0-9_]*"?\s*:\s*"?0x[0-9a-fA-F]{40}"?,?\s*$''']

[[allowlists]]
description = "Catalog source keys are division/agent-name slugs, not credentials. Two letter-led segments joined by one slash, so a bare token never matches."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"source_key":\s*"[a-z][a-z0-9]*(?:-[a-z0-9]+)*/[a-z][a-z0-9]*(?:-[a-z0-9]+)*",?\s*$''']

[[allowlists]]
description = "The example key pair of the W3C eddsa-jcs-2022 test vector (Data Integrity EdDSA Cryptosuites v1.0, Annex B.3) is published in the specification and signs nothing here but the vector. Only that exact value, in that one file, matches."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/foundation/vectors/eddsa-jcs-2022/keyPair\.json$''']
regexes = ['''^z3u2en7t5LR2WtQH5PfFqMqwVHBeXouLzo6haApm8XHqvjxq$''']

[[allowlists]]
description = "Validation evidence manifests list the SHA-256 of captured log files as \"<name>.log\": \"<64 hex>\". A digest of a log is public by design and not a credential. Only that line shape, in evidence JSON under foundation/evidence/, matches; a key with any other name, or in any other file, is still reported."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^foundation/evidence/[A-Za-z0-9._-]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9._-]+\.log":\s*"[0-9a-f]{64}",?\s*$''']
